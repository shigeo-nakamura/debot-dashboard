<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debot Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div>
          <h1 class="brand">Status Dashboard</h1>
        </div>
        <div class="meta">
          <div class="chip" id="last-updated">Loading...</div>
          <div class="range-toggle" id="range-toggle" role="group" aria-label="Equity range"></div>
        </div>
      </header>
      <section class="fleet-summary" id="fleet-summary" hidden>
        <div class="fleet-stat">
          <span class="fleet-stat-label">Targets</span>
          <span class="fleet-stat-value" data-field="fleet-total">0</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label">PnL today</span>
          <span class="fleet-stat-value" data-field="fleet-pnl-today">-</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label" title="Sum across targets of funding carry accrued by cycles closed today (UTC). Same window as `PnL today`. Surfaced by pairtrade since bot-strategy#371.">Funding today</span>
          <span class="fleet-stat-value" data-field="fleet-funding-today">-</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label" title="Sum across targets of (current equity − equity at the most recent UTC month rollover). Falls back to the earliest cached history point for bots that started mid-month.">PnL this month</span>
          <span class="fleet-stat-value" data-field="fleet-pnl-month">-</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label" title="Annualized return implied by the fleet's PnL this month (compounded). Noisy in the first couple of days of the month — needs ≥1 day of history past the UTC month rollover.">CAGR (month)</span>
          <span class="fleet-stat-value" data-field="fleet-cagr-month">-</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label">Equity total</span>
          <span class="fleet-stat-value" data-field="fleet-equity-total">-</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label" title="Sum of open position count across all targets whose position snapshot is ready.">Open positions</span>
          <span class="fleet-stat-value" data-field="fleet-positions-total">0</span>
        </div>
        <div class="fleet-stat">
          <span class="fleet-stat-label" title="Number of targets currently holding at least one open position.">Bots with positions</span>
          <span class="fleet-stat-value" data-field="fleet-bots-with-positions">0</span>
        </div>
        <div class="fleet-stat severity">
          <span class="fleet-stat-label">Halts active</span>
          <span class="fleet-stat-value" data-field="fleet-halts">0</span>
        </div>
        <div class="fleet-stat severity">
          <span class="fleet-stat-label">Kill switches</span>
          <span class="fleet-stat-value" data-field="fleet-kill-switches">0</span>
        </div>
        <div class="fleet-stat severity">
          <span class="fleet-stat-label">Services down</span>
          <span class="fleet-stat-value" data-field="fleet-services-down">0</span>
        </div>
        <div class="fleet-stat severity">
          <span class="fleet-stat-label">Halts last 24h</span>
          <span class="fleet-stat-value" data-field="fleet-halts-24h">0</span>
        </div>
      </section>
      <section class="regions" id="cards"></section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
