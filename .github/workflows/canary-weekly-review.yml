name: Canary weekly review

# bot-strategy#376 Phase 5: weekly report plus ALERT issue creation.
# WATCH remains tracking-only; ALERT opens a deduplicated actionable issue.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: eu-central-1
  TRACKING_ISSUE: "404"     # bot-strategy#404 "Canary weekly review log"

jobs:
  review:
    runs-on: ubuntu-latest
    environment: disk-watch
    steps:
      - name: Checkout pairtrade
        uses: actions/checkout@v5
        with:
          repository: shigeo-nakamura/pairtrade
          path: pairtrade
          token: ${{ secrets.PAIRTRADE_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install boto3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run canary_diff_report.py
        id: report
        run: |
          python3 pairtrade/scripts/canary_diff_report.py --days 7 > /tmp/report.md
          cat /tmp/report.md
          verdict=$(sed -nE 's/.*Verdict.*\*\*(PASS|WATCH|ALERT)\*\*.*/\1/p' /tmp/report.md | head -1)
          test -n "$verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Post report to tracking issue
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          gh issue comment "${TRACKING_ISSUE}" \
            --repo shigeo-nakamura/bot-strategy \
            --body-file /tmp/report.md

      - name: Open deduplicated issue on ALERT
        if: steps.report.outputs.verdict == 'ALERT'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: shigeo-nakamura/bot-strategy
        run: |
          set -euo pipefail
          title="[Canary (Frankfurt)] Weekly divergence ALERT"
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/report.md
            exit 0
          fi
          gh label create auto-error --repo "$REPO" --color d73a4a \
            --description "Auto-created by error-watch workflow" 2>/dev/null || true
          gh label create svc-canary-frankfurt --repo "$REPO" --color ededed \
            --description "Service: Canary (Frankfurt)" 2>/dev/null || true
          url=$(gh issue create --repo "$REPO" --title "$title" \
            --label auto-error --label svc-canary-frankfurt \
            --body-file /tmp/report.md)
          gh project item-add 3 --owner shigeo-nakamura --url "$url"
