name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  SERVICE_NAME: debot-dashboard
  INSTALL_DIR: /opt/debot-dashboard
  LISTEN_ADDR: :8080

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/debot-dashboard .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 cp dist/debot-dashboard "s3://${S3_BUCKET}/debot-dashboard/debot-dashboard"
          aws s3 cp deploy/debot-dashboard.service "s3://${S3_BUCKET}/deploy/debot-dashboard.service"

      - name: Deploy via SSM
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
        run: |
          cat > /tmp/ssm-params.json <<JSON
          {
            "commands": [
              "sudo mkdir -p ${INSTALL_DIR}",
              "aws s3 cp s3://${S3_BUCKET}/debot-dashboard/debot-dashboard ${INSTALL_DIR}/debot-dashboard",
              "sudo chmod 755 ${INSTALL_DIR}/debot-dashboard",
              "if [ ! -f /etc/systemd/system/${SERVICE_NAME}.service ]; then aws s3 cp s3://${S3_BUCKET}/deploy/debot-dashboard.service /tmp/${SERVICE_NAME}.service && sudo mv /tmp/${SERVICE_NAME}.service /etc/systemd/system/${SERVICE_NAME}.service && sudo systemctl daemon-reload && sudo systemctl enable ${SERVICE_NAME}; fi",
              "if [ ! -f ${INSTALL_DIR}/config.yaml ]; then echo \"Missing ${INSTALL_DIR}/config.yaml\" >&2; exit 1; fi",
              "sudo systemctl restart ${SERVICE_NAME}"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy debot-dashboard" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output text
