name: Disk Watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_page_pct:
        description: 'Temporary page threshold override (1-99) — for smoke-testing the issue-creation path'
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  issues: write
  contents: read

env:
  WARN_PCT: '70'
  PAGE_PCT: '85'

jobs:
  check:
    runs-on: ubuntu-latest
    environment: disk-watch
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frankfurt
            region: eu-central-1
          - name: arcus
            region: eu-central-1
          # Tokyo Robinhood Lighter host (i-0095af4fe0efbc5dd): engine-b-live,
          # the Engine B Phase 0 observer (~5 GB/day of SQLite, hourly S3
          # archive with 24 h retention -- bot-strategy#915) and the
          # book-runtime DRY_RUN. Added when the Grafana disk alert was
          # retired (bot-strategy#1014); the hourly archiver's preflight
          # stops draining when free space drops below ~4x a partition,
          # so a page here means the observer will fill the root volume.
          # Per-host thresholds: at ~205 MB/h the gap between 85% and the
          # archiver's own fail-closed floor (~91%, free < 4x partition +
          # 512 MiB) is ~6 h, so this leg pages at 75% (~16 h lead) and warns
          # at 60%. Steady state after an hourly drain is ~50%.
          - name: robinhood
            region: ap-northeast-1
            warn_pct: '60'
            page_pct: '75'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Resolve instance ID
        id: target
        env:
          FRANKFURT_INSTANCE_ID: ${{ secrets.FRANKFURT_INSTANCE_ID }}
          ARCUS_INSTANCE_ID: ${{ secrets.ARCUS_INSTANCE_ID }}
          ROBINHOOD_INSTANCE_ID: ${{ secrets.ROBINHOOD_INSTANCE_ID }}
        run: |
          case "${{ matrix.name }}" in
            frankfurt) id="$FRANKFURT_INSTANCE_ID" ;;
            arcus) id="$ARCUS_INSTANCE_ID" ;;
            robinhood) id="$ROBINHOOD_INSTANCE_ID" ;;
          esac
          if [ -z "$id" ]; then
            echo "::error::instance-ID secret for ${{ matrix.name }} is not set in the disk-watch environment"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run disk check via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail

          cat > /tmp/script.sh <<'BASH'
          set -e
          df -P /
          echo "----JOURNAL----"
          journalctl --disk-usage 2>&1 | head -1
          echo "----TOPDIRS----"
          # Skip the SSM agent's orchestration tree — it can hold 10s of K of
          # subdirs (#342) which makes du -d 1 /var take minutes. The size is
          # already known/expected and visible via df totals.
          du -h -d 1 \
            --exclude='*/amazon/ssm/*' \
            /var /usr /home /opt 2>/dev/null | sort -rh | head -5
          BASH

          jq -n --rawfile cmd /tmp/script.sh '{commands: [$cmd]}' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "disk-watch poll (bot-strategy#342)" \
            --parameters file:///tmp/params.json \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $CMD_ID"

          deadline=$(( $(date +%s) + 180 ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Cancelled|TimedOut|Failed)
                echo "::error::SSM command $CMD_ID failed with status $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output text || true
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::SSM command $CMD_ID stuck in $STATUS after 180s"
              exit 1
            fi
            sleep 3
          done

          OUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text)

          printf '%s\n' "$OUT" > out.txt
          cat out.txt

          # Parse the row whose mount point is "/", strip trailing %
          PCT=$(awk '$NF=="/" {gsub("%","",$5); print $5; exit}' out.txt)
          if [ -z "$PCT" ]; then
            echo "::error::Could not parse df output"
            exit 1
          fi
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

          {
            echo 'output<<DISKWATCH_EOF'
            cat out.txt
            echo 'DISKWATCH_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate threshold and report
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: shigeo-nakamura/bot-strategy
          NAME: ${{ matrix.name }}
          PCT: ${{ steps.ssm.outputs.pct }}
          OUTPUT: ${{ steps.ssm.outputs.output }}
          PAGE_PCT_OVERRIDE: ${{ inputs.force_page_pct }}
          HOST_WARN_PCT: ${{ matrix.warn_pct }}
          HOST_PAGE_PCT: ${{ matrix.page_pct }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          # Route auto-created issues to the GitHub Projects v2 board.
          # frankfurt goes to project #5 (strategy; the old #3 pairtrade
          # board was deleted 2026-09-08), arcus to #6 (Arcus,
          # bot-strategy#758), robinhood to #8 (Engine B, whose observer
          # is what fills that host). PROJECTS_TOKEN is a
          # fine-grained PAT with user-account Projects RW; the default
          # GITHUB_TOKEN cannot write user-scope projects.
          add_to_project() {
            local issue_url="$1" label="$2"
            if [ -z "${PROJECTS_TOKEN:-}" ]; then
              echo "::warning::PROJECTS_TOKEN unset — skipping project link for $issue_url"
              return 0
            fi
            local project_num=5
            case "$NAME" in
              arcus) project_num=6 ;;
              robinhood) project_num=8 ;;
            esac
            GH_TOKEN="$PROJECTS_TOKEN" gh project item-add "$project_num" \
              --owner shigeo-nakamura --url "$issue_url" \
              || echo "::warning::Failed to add $issue_url to project #$project_num"
          }

          # Allow a workflow_dispatch input to lower the page threshold so the
          # issue-creation path can be smoke-tested without waiting for a real
          # incident. Otherwise a per-host matrix threshold wins over the
          # workflow-level PAGE_PCT / WARN_PCT.
          effective_page="${PAGE_PCT_OVERRIDE:-${HOST_PAGE_PCT:-$PAGE_PCT}}"
          WARN_PCT="${HOST_WARN_PCT:-$WARN_PCT}"

          if [ "$PCT" -ge "$effective_page" ]; then
            tier=page
          elif [ "$PCT" -ge "$WARN_PCT" ]; then
            tier=warn
          else
            tier=ok
          fi

          {
            echo "## $NAME — ${PCT}% (tier=$tier)"
            echo
            echo '```'
            printf '%s\n' "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$tier" != "page" ]; then
            echo "Below page threshold (${effective_page}%) — no issue filed"
            exit 0
          fi

          gh label create disk-watch --repo "$REPO" --color b60205 \
            --description "Auto-created by disk-watch workflow" 2>/dev/null || true
          host_label="host-$NAME"
          gh label create "$host_label" --repo "$REPO" --color ededed \
            --description "Host: $NAME" 2>/dev/null || true

          # One fingerprint per host per day. Subsequent triggers comment on
          # the open issue rather than spawn duplicates.
          fp=$(printf '%s\n%s' "$NAME" "$(date -u +%F)" | sha256sum | cut -c1-16)

          # Skip if a closed issue with the same fp was triaged in the last day
          # (mirrors the dedupe pattern in error-watch.yml; see #108).
          recently_closed=$(gh issue list --repo "$REPO" --state closed \
            --label disk-watch --label "$host_label" \
            --search "fp:$fp created:>$(date -u --date='1 day ago' +%Y-%m-%d) in:body" \
            --json number --jq '.[0].number // ""')
          if [ -n "$recently_closed" ]; then
            echo "Skip: fp:$fp already handled on closed #$recently_closed"
            exit 0
          fi

          existing=$(gh issue list --repo "$REPO" --state open \
            --label disk-watch --label "$host_label" \
            --json number --jq '.[0].number // ""')

          body_file=$(mktemp)
          {
            echo "Auto-created by disk-watch workflow (bot-strategy#342)."
            echo
            echo "- **Host**: \`$NAME\`"
            echo "- **Used**: ${PCT}% (page threshold: ${effective_page}%)"
            echo
            echo '```'
            printf '%s\n' "$OUTPUT"
            echo '```'
            echo
            echo "Detected at: $(date -u +%FT%TZ)"
            if [ "$NAME" = robinhood ]; then
              echo
              echo "Remediation on this host is NOT disk-cleanup.yml (it has no robinhood leg): the writer is the Engine B Phase 0 observer, drained hourly by \`engine-b-phase0-archive.timer\` with 24 h retention. Check \`systemctl status engine-b-phase0-archive.service\` and the newest \`/var/lib/engine-b-phase0/sealed/*.json\`; runbook in pairtrade \`docs/engine-b-phase0-operations.md\` (bot-strategy#915). The archiver refuses to run below ~1.9 GB free."
            fi
            echo "<!-- fp:$fp -->"
          } > "$body_file"

          if [ -n "$existing" ]; then
            seen=$(gh issue view "$existing" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already on open #$existing"
              exit 0
            fi
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Commented on #$existing"
          else
            issue_url=$(gh issue create --repo "$REPO" \
              --title "[$NAME] Disk usage at ${PCT}% (page threshold)" \
              --body-file "$body_file" \
              --label disk-watch --label "$host_label")
            echo "Created $issue_url"
            add_to_project "$issue_url" "$host_label"
          fi
