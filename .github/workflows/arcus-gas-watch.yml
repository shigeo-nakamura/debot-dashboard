name: Arcus Gas Watch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force_page_wei:
        description: 'Temporary page threshold override (wei) -- for smoke-testing the issue-creation path'
        type: string
        required: false
        default: ''

permissions:
  issues: write
  contents: read
  # Read-only: this workflow only lists ARCUS_WALLET_EVER_FUNDED, it never
  # sets it (see the funding-runbook note below).
  actions: read

env:
  # KMS-derived Arcus Spot signer address (bot-strategy#772/#758). Public
  # on-chain data, not a secret -- the private key never leaves KMS.
  ARCUS_WALLET_ADDRESS: '0x53cb889b5f3928921abb5ec413a2501cbf6170c6'
  ROBINHOOD_CHAIN_RPC: 'https://rpc.mainnet.chain.robinhood.com'
  # 0.002 ETH: comfortably above a single Permit2 + swap's typical gas cost
  # on an Arbitrum-Orbit L2, well below the probe's overall loss caps.
  PAGE_WEI: '2000000000000000'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read Arcus wallet gas balance
        id: balance
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            response=$(curl -sS --fail --max-time 15 -X POST "$ROBINHOOD_CHAIN_RPC" \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$ARCUS_WALLET_ADDRESS\",\"latest\"]}") && break
            echo "::warning::attempt $attempt failed to reach $ROBINHOOD_CHAIN_RPC"
            response=""
            sleep 5
          done
          if [ -z "$response" ]; then
            echo "::error::could not reach $ROBINHOOD_CHAIN_RPC after 3 attempts"
            exit 1
          fi
          echo "response=$response"
          hex=$(echo "$response" | jq -r '.result // empty')
          if [ -z "$hex" ] || [ "$hex" = "null" ]; then
            echo "::error::malformed eth_getBalance response: $response"
            exit 1
          fi
          wei=$(python3 -c "print(int('$hex', 16))")
          echo "wei=$wei" >> "$GITHUB_OUTPUT"

      - name: Track whether the wallet has ever held a positive balance
        id: funded
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_REPO: shigeo-nakamura/debot-dashboard
          WEI: ${{ steps.balance.outputs.wei }}
        run: |
          set -euo pipefail
          # Zero alone can't distinguish "never funded yet" (expected
          # pre-launch, per bot-strategy#772's separate funding approval)
          # from "was funded, now fully drained" (the single most urgent
          # low-gas state there is) -- inferring it from the current
          # reading would silently suppress the latter forever (Codex P1
          # follow-up, debot-dashboard#16). A persisted repo variable is
          # the explicit signal instead.
          #
          # This workflow only *reads* ARCUS_WALLET_EVER_FUNDED, never
          # sets it. The wallet address is public, so anyone can send it
          # a dust amount before the real, deliberate funding step in
          # bot-strategy#775's runbook (~08-10) -- auto-setting the flag
          # from any observed positive balance would let that dust
          # transfer permanently defeat the pre-launch suppression it
          # exists to provide (Codex P2 follow-up, debot-dashboard#16).
          # The funding runbook itself must run, once, as part of
          # actually funding the wallet:
          #   gh variable set ARCUS_WALLET_EVER_FUNDED --repo shigeo-nakamura/debot-dashboard --body true
          #
          # `gh variable` has no `get` subcommand, so existence is checked
          # via `list`. Only a *successful* list that simply doesn't
          # contain the variable yet (the expected pre-funding state) may
          # default to false. The list command itself failing -- auth,
          # rate limit, a transient API error -- must fail the job loudly
          # instead of silently reintroducing the exact zero-balance-
          # suppression bug this step exists to close: a masked lookup
          # failure on a genuinely drained, previously-funded wallet would
          # again report it as merely "not yet funded".
          list_output=$(gh variable list --repo "$DASHBOARD_REPO" --json name,value)
          ever_funded=$(echo "$list_output" | jq -r '.[] | select(.name == "ARCUS_WALLET_EVER_FUNDED") | .value')
          ever_funded="${ever_funded:-false}"
          echo "ever_funded=$ever_funded" >> "$GITHUB_OUTPUT"

      - name: Evaluate threshold and report
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: shigeo-nakamura/bot-strategy
          WEI: ${{ steps.balance.outputs.wei }}
          EVER_FUNDED: ${{ steps.funded.outputs.ever_funded }}
          PAGE_WEI_OVERRIDE: ${{ inputs.force_page_wei }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          effective_page="${PAGE_WEI_OVERRIDE:-$PAGE_WEI}"

          {
            echo "## Arcus gas balance -- ${WEI} wei (page threshold: ${effective_page} wei, ever funded: ${EVER_FUNDED})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WEI" -eq 0 ] && [ "$EVER_FUNDED" != "true" ]; then
            echo "Wallet not yet funded -- no issue filed"
            exit 0
          fi
          if [ "$WEI" -ge "$effective_page" ]; then
            echo "Above page threshold (${effective_page} wei) -- no issue filed"
            exit 0
          fi

          gh label create arcus-gas-watch --repo "$REPO" --color b60205 \
            --description "Auto-created by arcus-gas-watch workflow" 2>/dev/null || true

          # One fingerprint per day; subsequent triggers comment on the open
          # issue rather than spawn duplicates (mirrors disk-watch.yml).
          fp=$(date -u +%F | sha256sum | cut -c1-16)

          # A multi-day-open issue's later fingerprints land in *comments*,
          # not the body -- searching "in:body" alone would miss those
          # once the issue is closed, letting the next hourly run recreate
          # a duplicate (Codex P2 follow-up, debot-dashboard#16). Find the
          # candidate by label/recency only, then inspect its full
          # body+comments the same way the open-issue path below does.
          # Filter by *closed* date, not created date -- an issue opened
          # more than a day ago but closed today must still be found
          # (Codex P2 follow-up, debot-dashboard#16, round 3).
          recently_closed=$(gh issue list --repo "$REPO" --state closed \
            --label arcus-gas-watch \
            --search "closed:>$(date -u --date='1 day ago' +%Y-%m-%d)" \
            --json number --jq '.[0].number // ""')
          if [ -n "$recently_closed" ]; then
            seen=$(gh issue view "$recently_closed" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already handled on closed #$recently_closed"
              exit 0
            fi
          fi

          existing=$(gh issue list --repo "$REPO" --state open \
            --label arcus-gas-watch \
            --json number --jq '.[0].number // ""')

          body_file=$(mktemp)
          {
            echo "Auto-created by arcus-gas-watch workflow (bot-strategy#758)."
            echo
            echo "- **Wallet**: \`$ARCUS_WALLET_ADDRESS\`"
            echo "- **Gas balance**: ${WEI} wei (page threshold: ${effective_page} wei)"
            echo
            echo "Detected at: $(date -u +%FT%TZ)"
            echo "<!-- fp:$fp -->"
          } > "$body_file"

          if [ -n "$existing" ]; then
            seen=$(gh issue view "$existing" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already on open #$existing"
              exit 0
            fi
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Commented on #$existing"
          else
            issue_url=$(gh issue create --repo "$REPO" \
              --title "[arcus] Gas balance at ${WEI} wei (page threshold)" \
              --body-file "$body_file" \
              --label arcus-gas-watch)
            echo "Created $issue_url"
            if [ -n "${PROJECTS_TOKEN:-}" ]; then
              GH_TOKEN="$PROJECTS_TOKEN" gh project item-add 6 \
                --owner shigeo-nakamura --url "$issue_url" \
                || echo "::warning::Failed to add $issue_url to project #6"
            else
              echo "::warning::PROJECTS_TOKEN unset -- skipping project link"
            fi
          fi
