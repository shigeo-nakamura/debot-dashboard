name: Arcus Gas Watch

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force_page_wei:
        description: 'Temporary page threshold override (wei) -- for smoke-testing the issue-creation path'
        type: string
        required: false
        default: ''

# The workflow's cross-repository issue/project operations authenticate with
# PROJECTS_TOKEN only when an alert must be reported. Reading repository
# configuration through the `vars` context does not require a GitHub API call
# or any GITHUB_TOKEN permission.
permissions: {}

# Serialize runs instead of letting an overlapping hourly + workflow_dispatch
# (e.g. a smoke test) both pass the "no open issue yet" check and create a
# duplicate. Never cancel an in-flight run: it could be mid-way through
# filing or updating a genuine low-gas incident (Codex P2 follow-up,
# debot-dashboard#16).
concurrency:
  group: arcus-gas-watch
  cancel-in-progress: false

env:
  # Public, non-secret operational configuration. Both values are required
  # repository variables and are validated before the RPC call. Wallet
  # rotations must update ARCUS_WALLET_ADDRESS as part of the custody
  # rotation runbook; see deploy/arcus-gas-watch.md.
  ARCUS_WALLET_ADDRESS: ${{ vars.ARCUS_WALLET_ADDRESS }}
  ARCUS_WALLET_EVER_FUNDED: ${{ vars.ARCUS_WALLET_EVER_FUNDED }}
  ROBINHOOD_CHAIN_RPC: 'https://rpc.mainnet.chain.robinhood.com'
  # 0.002 ETH: comfortably above a single Permit2 + swap's typical gas cost
  # on an Arbitrum-Orbit L2, well below the probe's overall loss caps.
  PAGE_WEI: '2000000000000000'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Arcus gas-watch configuration
        run: |
          set -euo pipefail
          if [[ ! "$ARCUS_WALLET_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "::error::ARCUS_WALLET_ADDRESS must be a configured 20-byte EVM address"
            exit 1
          fi
          case "$ARCUS_WALLET_EVER_FUNDED" in
            true|false) ;;
            *)
              echo "::error::ARCUS_WALLET_EVER_FUNDED must be explicitly configured as true or false"
              exit 1
              ;;
          esac

      - name: Read Arcus wallet gas balance
        id: balance
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            response=$(curl -sS --fail --max-time 15 -X POST "$ROBINHOOD_CHAIN_RPC" \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$ARCUS_WALLET_ADDRESS\",\"latest\"]}") && break
            echo "::warning::attempt $attempt failed to reach $ROBINHOOD_CHAIN_RPC"
            response=""
            sleep 5
          done
          if [ -z "$response" ]; then
            echo "::error::could not reach $ROBINHOOD_CHAIN_RPC after 3 attempts"
            exit 1
          fi
          echo "response=$response"
          hex=$(echo "$response" | jq -r '.result // empty')
          if [ -z "$hex" ] || [ "$hex" = "null" ]; then
            echo "::error::malformed eth_getBalance response: $response"
            exit 1
          fi
          # Pass through an environment variable, never shell-interpolated
          # into the Python source string: the RPC response is untrusted
          # external data, and string interpolation into `python3 -c`
          # would let a crafted value break out of the string literal and
          # execute arbitrary Python (Codex P1 follow-up,
          # debot-dashboard#16, round 5).
          wei=$(HEX="$hex" python3 -c "import os; print(int(os.environ['HEX'], 16))")
          echo "wei=$wei" >> "$GITHUB_OUTPUT"

      - name: Evaluate threshold and report
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: shigeo-nakamura/bot-strategy
          WEI: ${{ steps.balance.outputs.wei }}
          PAGE_WEI_OVERRIDE: ${{ inputs.force_page_wei }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          effective_page="${PAGE_WEI_OVERRIDE:-$PAGE_WEI}"
          # A manual workflow_dispatch can supply force_page_wei freely;
          # reject anything that isn't plain decimal digits before it goes
          # anywhere near Python (defense in depth alongside passing it
          # through the environment below, not shell-interpolated into
          # source -- Codex P1 follow-up, debot-dashboard#16, round 5).
          case "$effective_page" in
            ''|*[!0-9]*)
              echo "::error::PAGE_WEI_OVERRIDE/PAGE_WEI must be decimal digits, got: $effective_page"
              exit 1
              ;;
          esac

          {
            echo "## Arcus gas balance -- ${WEI} wei (wallet: ${ARCUS_WALLET_ADDRESS}, page threshold: ${effective_page} wei, ever funded: ${ARCUS_WALLET_EVER_FUNDED})"
          } >> "$GITHUB_STEP_SUMMARY"

          # Bash's `[ -eq/-ge ]` parses operands as signed 64-bit integers;
          # a wei value >= 2^63 (~9.22 native tokens) makes it emit
          # "integer expression expected" and, because that happens inside
          # an `if` condition, `set -e` does not stop the script -- it
          # just silently falls through as if the comparison were false,
          # which could file a low-gas issue for a well-funded wallet
          # (Codex P2 follow-up, debot-dashboard#16, round 4). Compare with
          # Python's arbitrary-precision integers instead, passed through
          # the environment rather than interpolated into `python3 -c`'s
          # source: WEI ultimately traces back to an external RPC
          # response, and EFFECTIVE_PAGE can be attacker-supplied via
          # workflow_dispatch -- string interpolation would let either
          # break out of the literal and run arbitrary Python with
          # PROJECTS_TOKEN in the environment (Codex P1 follow-up,
          # debot-dashboard#16, round 5).
          # Gate on the authorized funding flag alone, not on the observed
          # balance being exactly zero: the wallet address is public, so
          # an unsolicited dust transfer below the page threshold (not
          # zero, but not a real funding either) would otherwise bypass
          # this guard and file a production low-gas issue every day
          # until the wallet is genuinely funded (Codex P2 follow-up,
          # debot-dashboard#16, round 7). A smoke-test dispatch
          # (force_page_wei set) explicitly bypasses this gate so the
          # alert path can still be tested before launch.
          if [ "$ARCUS_WALLET_EVER_FUNDED" != "true" ] && [ -z "$PAGE_WEI_OVERRIDE" ]; then
            echo "Wallet not yet authorized-funded -- no issue filed"
            exit 0
          fi
          above_threshold=$(WEI="$WEI" EFFECTIVE_PAGE="$effective_page" python3 -c "import os; print('true' if int(os.environ['WEI']) >= int(os.environ['EFFECTIVE_PAGE']) else 'false')")
          if [ "$above_threshold" = "true" ]; then
            echo "Above page threshold (${effective_page} wei) -- no issue filed"
            exit 0
          fi

          # A force_page_wei smoke test gets its own label, fingerprint
          # namespace, and title prefix -- fully separate from the
          # production incident stream at every lookup, not just the
          # fingerprint. Sharing the "arcus-gas-watch" label meant a
          # left-open smoke-test issue would absorb a genuine low-balance
          # reading as a comment under a title still marked [SMOKE TEST]
          # instead of ever creating a real production alert (Codex P2
          # follow-up, debot-dashboard#16, rounds 5-6).
          label="arcus-gas-watch"
          title_prefix="[arcus]"
          if [ -n "$PAGE_WEI_OVERRIDE" ]; then
            label="arcus-gas-watch-smoketest"
            title_prefix="[arcus] [SMOKE TEST]"
          fi
          gh label create "$label" --repo "$REPO" --color b60205 \
            --description "Auto-created by arcus-gas-watch workflow" 2>/dev/null || true

          # One fingerprint per day per stream (production vs smoke-test);
          # subsequent triggers comment on the open issue rather than
          # spawn duplicates (mirrors disk-watch.yml).
          fp=$(echo "${label}-$(date -u +%F)" | sha256sum | cut -c1-16)

          # A multi-day-open issue's later fingerprints land in *comments*,
          # not the body -- searching "in:body" alone would miss those
          # once the issue is closed, letting the next hourly run recreate
          # a duplicate (Codex P2 follow-up, debot-dashboard#16). Find
          # candidates by label/recency only, then inspect each one's full
          # body+comments the same way the open-issue path below does --
          # not just the single newest match: if more than one issue in
          # this label closed within the window, the fingerprint could be
          # on an older one that `.[0]` would skip past (Codex P2
          # follow-up, debot-dashboard#16, round 6). Filter by *closed*
          # date, not created date -- an issue opened more than a day ago
          # but closed today must still be found (round 3).
          recently_closed=$(gh issue list --repo "$REPO" --state closed \
            --label "$label" \
            --search "closed:>$(date -u --date='1 day ago' +%Y-%m-%d)" \
            --json number --jq '.[].number')
          already_handled=false
          for candidate in $recently_closed; do
            seen=$(gh issue view "$candidate" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already handled on closed #$candidate"
              already_handled=true
              break
            fi
          done
          if [ "$already_handled" = "true" ]; then
            exit 0
          fi

          existing=$(gh issue list --repo "$REPO" --state open \
            --label "$label" \
            --json number --jq '.[0].number // ""')

          body_file=$(mktemp)
          {
            echo "Auto-created by arcus-gas-watch workflow (bot-strategy#758)."
            echo
            echo "- **Wallet**: \`$ARCUS_WALLET_ADDRESS\`"
            echo "- **Gas balance**: ${WEI} wei (page threshold: ${effective_page} wei)"
            echo
            echo "Detected at: $(date -u +%FT%TZ)"
            echo "<!-- fp:$fp -->"
          } > "$body_file"

          if [ -n "$existing" ]; then
            seen=$(gh issue view "$existing" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already on open #$existing"
              exit 0
            fi
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Commented on #$existing"
          else
            issue_url=$(gh issue create --repo "$REPO" \
              --title "${title_prefix} Gas balance at ${WEI} wei (page threshold)" \
              --body-file "$body_file" \
              --label "$label")
            echo "Created $issue_url"
            if [ -n "${PROJECTS_TOKEN:-}" ]; then
              GH_TOKEN="$PROJECTS_TOKEN" gh project item-add 6 \
                --owner shigeo-nakamura --url "$issue_url" \
                || echo "::warning::Failed to add $issue_url to project #6"
            else
              echo "::warning::PROJECTS_TOKEN unset -- skipping project link"
            fi
          fi
