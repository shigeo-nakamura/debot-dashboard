name: Arcus Health Watch

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force_page:
        description: 'Force every check to page -- for smoke-testing the issue-creation path'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  issues: write
  contents: read

# Serialize runs instead of letting an overlapping scheduled run and a
# workflow_dispatch (e.g. a smoke test) both observe "no open issue yet"
# and create duplicates. Never cancel an in-flight run: it could be
# mid-way through filing or updating a genuine incident (Codex P2
# follow-up, debot-dashboard#17).
concurrency:
  group: arcus-health-watch
  cancel-in-progress: false

env:
  ROBINHOOD_CHAIN_ROUTER: 'https://router.spot.arcus.xyz'
  # Both collectors run on a ~15-minute timer; page only once data is more
  # than 2.5x that cadence old, to absorb ordinary jitter without noise.
  STALE_SECS: '2250'

jobs:
  router-availability:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - name: Check the public Arcus Spot router
        id: check
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            "$ROBINHOOD_CHAIN_ROUTER/v1/tokens?chainId=4663" || echo "000")
          echo "http_code=$http_code"
          if [ "$http_code" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "kind=" >> "$GITHUB_OUTPUT"
          else
            echo "status=unavailable (http $http_code)" >> "$GITHUB_OUTPUT"
            # A stable kind for the fingerprint -- deliberately omits the
            # dynamic http_code, which would otherwise defeat same-day
            # dedup for an ongoing outage (Codex P1 follow-up,
            # debot-dashboard#17).
            echo "kind=router_unavailable" >> "$GITHUB_OUTPUT"
          fi

  host-health:
    runs-on: ubuntu-latest
    environment: disk-watch
    outputs:
      findings: ${{ steps.ssm.outputs.findings }}
      kinds: ${{ steps.ssm.outputs.kinds }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Run process/stale-data checks via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.ARCUS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          cat > /tmp/script.sh <<'BASH'
          set -e
          now=$(date +%s)
          echo "NOW=$now"
          for timer in arcus-spot-quote-collector arcus-spot-rust-recorder archive-arcus-quotes arcus-spot-live-tick; do
            active=$(systemctl is-active "${timer}.timer" 2>&1 || true)
            enabled=$(systemctl is-enabled "${timer}.timer" 2>&1 || true)
            result=$(systemctl show "${timer}.service" -p Result --value 2>&1 || true)
            echo "TIMER ${timer} active=${active} enabled=${enabled} last_result=${result}"
          done
          for f in /var/lib/debot-arcus/spot-quote/latest.json /var/lib/debot-arcus/spot-rust/latest.json; do
            if [ -f "$f" ]; then
              mtime=$(stat -c %Y "$f")
              echo "FILE ${f} mtime=${mtime}"
            else
              echo "FILE ${f} missing"
            fi
          done
          BASH

          jq -n --rawfile cmd /tmp/script.sh '{commands: [$cmd]}' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "arcus-health-watch poll (bot-strategy#758)" \
            --parameters file:///tmp/params.json \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $CMD_ID"

          deadline=$(( $(date +%s) + 180 ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Cancelled|TimedOut|Failed)
                echo "::error::SSM command $CMD_ID failed with status $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output text || true
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::SSM command $CMD_ID stuck in $STATUS after 180s"
              exit 1
            fi
            sleep 3
          done

          OUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text)
          printf '%s\n' "$OUT" > out.txt
          cat out.txt

          now=$(awk -F= '/^NOW=/ {print $2}' out.txt)

          # Two parallel outputs: `findings` is the human-readable text
          # (can include dynamic values like exact staleness in seconds),
          # `kinds` is a *stable* space-separated list of which specific
          # checks failed (never a dynamic value), used only to build the
          # dedup fingerprint downstream. Collapsing every failure kind
          # into one date-only fingerprint would let an early failure's
          # fingerprint suppress a later, different failure the same day
          # (Codex P1 follow-up, debot-dashboard#17).
          findings=""
          kinds=""
          # The two recorders are oneshot units that deliberately exit
          # non-zero whenever their snapshot captured router/venue errors
          # (e.g. the arcus venue answering 422 NO_QUOTES on some pairs)
          # even though they still wrote a complete sample. That exit code
          # is the upstream venue's health, not the collector's, and paged
          # for days during the 2026-09-03..06 router degradation after the
          # actual recorder fault was fixed (bot-strategy#865). For those
          # units the Result is therefore judged together with their output
          # file: page only if the file is also stale or missing. Every
          # other timer, and every other Result value (signal, timeout,
          # watchdog, ...), keeps the plain "last run did not succeed" rule.
          deferred_results=""
          unhealthy_paths=""
          while IFS= read -r line; do
            case "$line" in
              TIMER*)
                name=$(echo "$line" | awk '{print $2}')
                active=$(echo "$line" | sed -n 's/.*active=\([^ ]*\).*/\1/p')
                enabled=$(echo "$line" | sed -n 's/.*enabled=\([^ ]*\).*/\1/p')
                result=$(echo "$line" | sed -n 's/.*last_result=\([^ ]*\).*/\1/p')
                if [ "$active" != "active" ]; then
                  findings="${findings}${name}.timer is not active (${active}); "
                  kinds="${kinds}timer:${name}:inactive "
                fi
                if [ "$enabled" != "enabled" ]; then
                  findings="${findings}${name}.timer is not enabled (${enabled}); "
                  kinds="${kinds}timer:${name}:disabled "
                fi
                if [ -n "$result" ] && [ "$result" != "success" ]; then
                  # Only the deliberate non-zero exit (Result=exit-code) is
                  # deferred; signal/timeout/watchdog/core-dump etc. are
                  # real service failures and page immediately even while
                  # the previous file is still fresh (Codex P2, #30).
                  case "${name}:${result}" in
                    arcus-spot-rust-recorder:exit-code|arcus-spot-quote-collector:exit-code)
                      deferred_results="${deferred_results}${name}=${result} "
                      ;;
                    *)
                      findings="${findings}${name}.service last run did not succeed (Result=${result}); "
                      kinds="${kinds}timer:${name}:result_failed "
                      ;;
                  esac
                fi
                ;;
              FILE*)
                if echo "$line" | grep -q "missing"; then
                  path=$(echo "$line" | awk '{print $2}')
                  findings="${findings}${path} is missing; "
                  kinds="${kinds}file:${path}:missing "
                  unhealthy_paths="${unhealthy_paths}${path} "
                else
                  path=$(echo "$line" | awk '{print $2}')
                  mtime=$(echo "$line" | sed -n 's/.*mtime=\([0-9]*\).*/\1/p')
                  age=$(( now - mtime ))
                  if [ "$age" -gt "$STALE_SECS" ]; then
                    findings="${findings}${path} is ${age}s stale (threshold ${STALE_SECS}s); "
                    kinds="${kinds}file:${path}:stale "
                    unhealthy_paths="${unhealthy_paths}${path} "
                  fi
                fi
                ;;
            esac
          done < out.txt

          for entry in $deferred_results; do
            name=${entry%%=*}
            result=${entry#*=}
            case "$name" in
              arcus-spot-rust-recorder) path=/var/lib/debot-arcus/spot-rust/latest.json ;;
              arcus-spot-quote-collector) path=/var/lib/debot-arcus/spot-quote/latest.json ;;
            esac
            if echo " $unhealthy_paths " | grep -q " $path "; then
              findings="${findings}${name}.service last run did not succeed (Result=${result}) and its output is stale or missing; "
              kinds="${kinds}timer:${name}:result_failed "
            else
              echo "info: ${name}.service last run Result=${result} but ${path} is fresh -- captured venue errors, not a collector fault; not paging (bot-strategy#865)"
            fi
          done

          {
            echo 'findings<<HEALTHWATCH_EOF'
            echo "$findings"
            echo 'HEALTHWATCH_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "kinds=${kinds}" >> "$GITHUB_OUTPUT"

  report:
    needs: [router-availability, host-health]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate and report
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: shigeo-nakamura/bot-strategy
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROUTER_STATUS: ${{ needs.router-availability.outputs.status }}
          ROUTER_KIND: ${{ needs.router-availability.outputs.kind }}
          HOST_FINDINGS: ${{ needs.host-health.outputs.findings }}
          HOST_KINDS: ${{ needs.host-health.outputs.kinds }}
          HOST_HEALTH_RESULT: ${{ needs.host-health.result }}
          FORCE_PAGE: ${{ inputs.force_page }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          problems=""
          problem_kinds=""
          if [ "$ROUTER_STATUS" != "ok" ]; then
            problems="${problems}Router unavailable: ${ROUTER_STATUS}; "
            problem_kinds="${problem_kinds}${ROUTER_KIND} "
          fi
          if [ "$HOST_HEALTH_RESULT" != "success" ]; then
            # The host-health job failing outright (AWS credentials, SSM
            # command itself erroring, etc.) never populates HOST_FINDINGS
            # -- without this branch the issue body would say "Host
            # findings: none" with no indication anything went wrong
            # (Codex P2 follow-up, debot-dashboard#17).
            problems="${problems}host-health job itself failed (result=${HOST_HEALTH_RESULT}); see ${RUN_URL}; "
            problem_kinds="${problem_kinds}host_health_job_failed:${HOST_HEALTH_RESULT} "
          fi
          if [ -n "$HOST_FINDINGS" ]; then
            problems="${problems}${HOST_FINDINGS}"
          fi
          if [ -n "$HOST_KINDS" ]; then
            problem_kinds="${problem_kinds}${HOST_KINDS}"
          fi
          if [ "$FORCE_PAGE" = "true" ]; then
            problems="${problems}[forced smoke test] "
          fi

          {
            echo "## Arcus health watch"
            echo "- Router: ${ROUTER_STATUS}"
            echo "- host-health job result: ${HOST_HEALTH_RESULT}"
            echo "- Host findings: ${HOST_FINDINGS:-none}"
            echo "- Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$problems" ]; then
            echo "All checks passed -- no issue filed"
            exit 0
          fi

          label="arcus-health-watch"
          if [ "$FORCE_PAGE" = "true" ]; then
            label="arcus-health-watch-smoketest"
          fi
          gh label create "$label" --repo "$REPO" --color b60205 \
            --description "Auto-created by arcus-health-watch workflow" 2>/dev/null || true

          # Stable failure identities only (never a dynamic value like an
          # http_code or a staleness-in-seconds count), so a genuinely
          # different failure later the same day gets its own fingerprint
          # instead of being suppressed by an earlier, unrelated one's
          # (Codex P1 follow-up, debot-dashboard#17).
          normalized_kinds=$(echo "$problem_kinds" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ',')
          fp=$(echo "${label}-$(date -u +%F)-${normalized_kinds}" | sha256sum | cut -c1-16)

          recently_closed=$(gh issue list --repo "$REPO" --state closed \
            --label "$label" \
            --search "closed:>$(date -u --date='1 day ago' +%Y-%m-%d)" \
            --json number --jq '.[].number')
          already_handled=false
          for candidate in $recently_closed; do
            seen=$(gh issue view "$candidate" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              already_handled=true
              break
            fi
          done
          if [ "$already_handled" = "true" ]; then
            echo "Skip: fp:$fp already handled on a recently closed issue"
            exit 0
          fi

          existing=$(gh issue list --repo "$REPO" --state open \
            --label "$label" \
            --json number --jq '.[0].number // ""')

          body_file=$(mktemp)
          {
            echo "Auto-created by arcus-health-watch workflow (bot-strategy#758)."
            echo
            echo "- **Router**: ${ROUTER_STATUS}"
            echo "- **host-health job result**: ${HOST_HEALTH_RESULT}"
            echo "- **Host findings**: ${HOST_FINDINGS:-none}"
            echo "- **Run**: ${RUN_URL}"
            echo
            echo "Detected at: $(date -u +%FT%TZ)"
            echo "<!-- fp:$fp -->"
          } > "$body_file"

          if [ -n "$existing" ]; then
            seen=$(gh issue view "$existing" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already on open #$existing"
              exit 0
            fi
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Commented on #$existing"
          else
            title_prefix="[arcus]"
            if [ "$FORCE_PAGE" = "true" ]; then
              title_prefix="[arcus] [SMOKE TEST]"
            fi
            issue_url=$(gh issue create --repo "$REPO" \
              --title "${title_prefix} Health check failure" \
              --body-file "$body_file" \
              --label "$label")
            echo "Created $issue_url"
            if [ -n "${PROJECTS_TOKEN:-}" ]; then
              GH_TOKEN="$PROJECTS_TOKEN" gh project item-add 6 \
                --owner shigeo-nakamura --url "$issue_url" \
                || echo "::warning::Failed to add $issue_url to project #6"
            else
              echo "::warning::PROJECTS_TOKEN unset -- skipping project link"
            fi
          fi
