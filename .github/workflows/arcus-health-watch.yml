name: Arcus Health Watch

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force_page:
        description: 'Force every check to page -- for smoke-testing the issue-creation path'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  issues: write
  contents: read

env:
  ROBINHOOD_CHAIN_ROUTER: 'https://router.spot.arcus.xyz'
  # Both collectors run on a ~15-minute timer; page only once data is more
  # than 2.5x that cadence old, to absorb ordinary jitter without noise.
  STALE_SECS: '2250'

jobs:
  router-availability:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Check the public Arcus Spot router
        id: check
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            "$ROBINHOOD_CHAIN_ROUTER/v1/tokens?chainId=4663" || echo "000")
          echo "http_code=$http_code"
          if [ "$http_code" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=unavailable (http $http_code)" >> "$GITHUB_OUTPUT"
          fi

  host-health:
    runs-on: ubuntu-latest
    environment: disk-watch
    outputs:
      findings: ${{ steps.ssm.outputs.findings }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Run process/stale-data checks via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.ARCUS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          cat > /tmp/script.sh <<'BASH'
          set -e
          now=$(date +%s)
          echo "NOW=$now"
          for timer in arcus-spot-quote-collector arcus-spot-rust-recorder archive-arcus-quotes; do
            active=$(systemctl is-active "${timer}.timer" 2>&1 || true)
            result=$(systemctl show "${timer}.service" -p Result --value 2>&1 || true)
            echo "TIMER ${timer} active=${active} last_result=${result}"
          done
          for f in /var/lib/debot-arcus/spot-quote/latest.json /var/lib/debot-arcus/spot-rust/latest.json; do
            if [ -f "$f" ]; then
              mtime=$(stat -c %Y "$f")
              echo "FILE ${f} mtime=${mtime}"
            else
              echo "FILE ${f} missing"
            fi
          done
          BASH

          jq -n --rawfile cmd /tmp/script.sh '{commands: [$cmd]}' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "arcus-health-watch poll (bot-strategy#758)" \
            --parameters file:///tmp/params.json \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $CMD_ID"

          deadline=$(( $(date +%s) + 180 ))
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Cancelled|TimedOut|Failed)
                echo "::error::SSM command $CMD_ID failed with status $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output text || true
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::SSM command $CMD_ID stuck in $STATUS after 180s"
              exit 1
            fi
            sleep 3
          done

          OUT=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text)
          printf '%s\n' "$OUT" > out.txt
          cat out.txt

          now=$(awk -F= '/^NOW=/ {print $2}' out.txt)

          findings=""
          while IFS= read -r line; do
            case "$line" in
              TIMER*)
                name=$(echo "$line" | awk '{print $2}')
                active=$(echo "$line" | sed -n 's/.*active=\([^ ]*\).*/\1/p')
                result=$(echo "$line" | sed -n 's/.*last_result=\([^ ]*\).*/\1/p')
                if [ "$active" != "active" ]; then
                  findings="${findings}${name}.timer is not active (${active}); "
                fi
                if [ -n "$result" ] && [ "$result" != "success" ]; then
                  findings="${findings}${name}.service last run did not succeed (Result=${result}); "
                fi
                ;;
              FILE*)
                if echo "$line" | grep -q "missing"; then
                  path=$(echo "$line" | awk '{print $2}')
                  findings="${findings}${path} is missing; "
                else
                  path=$(echo "$line" | awk '{print $2}')
                  mtime=$(echo "$line" | sed -n 's/.*mtime=\([0-9]*\).*/\1/p')
                  age=$(( now - mtime ))
                  if [ "$age" -gt "$STALE_SECS" ]; then
                    findings="${findings}${path} is ${age}s stale (threshold ${STALE_SECS}s); "
                  fi
                fi
                ;;
            esac
          done < out.txt

          {
            echo 'findings<<HEALTHWATCH_EOF'
            echo "$findings"
            echo 'HEALTHWATCH_EOF'
          } >> "$GITHUB_OUTPUT"

  report:
    needs: [router-availability, host-health]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate and report
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: shigeo-nakamura/bot-strategy
          ROUTER_STATUS: ${{ needs.router-availability.outputs.status }}
          HOST_FINDINGS: ${{ needs.host-health.outputs.findings }}
          HOST_HEALTH_RESULT: ${{ needs.host-health.result }}
          FORCE_PAGE: ${{ inputs.force_page }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          problems=""
          if [ "$ROUTER_STATUS" != "ok" ]; then
            problems="${problems}Router unavailable: ${ROUTER_STATUS}; "
          fi
          if [ "$HOST_HEALTH_RESULT" != "success" ]; then
            problems="${problems}host-health job itself failed (SSM/AWS-side issue) -- see workflow run; "
          fi
          if [ -n "$HOST_FINDINGS" ]; then
            problems="${problems}${HOST_FINDINGS}"
          fi
          if [ "$FORCE_PAGE" = "true" ]; then
            problems="${problems}[forced smoke test] "
          fi

          {
            echo "## Arcus health watch"
            echo "- Router: ${ROUTER_STATUS}"
            echo "- Host findings: ${HOST_FINDINGS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$problems" ]; then
            echo "All checks passed -- no issue filed"
            exit 0
          fi

          label="arcus-health-watch"
          if [ "$FORCE_PAGE" = "true" ]; then
            label="arcus-health-watch-smoketest"
          fi
          gh label create "$label" --repo "$REPO" --color b60205 \
            --description "Auto-created by arcus-health-watch workflow" 2>/dev/null || true

          fp=$(echo "${label}-$(date -u +%F)" | sha256sum | cut -c1-16)

          recently_closed=$(gh issue list --repo "$REPO" --state closed \
            --label "$label" \
            --search "closed:>$(date -u --date='1 day ago' +%Y-%m-%d)" \
            --json number --jq '.[].number')
          already_handled=false
          for candidate in $recently_closed; do
            seen=$(gh issue view "$candidate" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              already_handled=true
              break
            fi
          done
          if [ "$already_handled" = "true" ]; then
            echo "Skip: fp:$fp already handled on a recently closed issue"
            exit 0
          fi

          existing=$(gh issue list --repo "$REPO" --state open \
            --label "$label" \
            --json number --jq '.[0].number // ""')

          body_file=$(mktemp)
          {
            echo "Auto-created by arcus-health-watch workflow (bot-strategy#758)."
            echo
            echo "- **Router**: ${ROUTER_STATUS}"
            echo "- **Host findings**: ${HOST_FINDINGS:-none}"
            echo
            echo "Detected at: $(date -u +%FT%TZ)"
            echo "<!-- fp:$fp -->"
          } > "$body_file"

          if [ -n "$existing" ]; then
            seen=$(gh issue view "$existing" --repo "$REPO" --json body,comments \
              --jq '.body + "\n" + ([.comments[].body] | join("\n"))' \
              | grep -c "fp:$fp" || true)
            if [ "$seen" -gt 0 ]; then
              echo "Skip: fp:$fp already on open #$existing"
              exit 0
            fi
            gh issue comment "$existing" --repo "$REPO" --body-file "$body_file"
            echo "Commented on #$existing"
          else
            title_prefix="[arcus]"
            if [ "$FORCE_PAGE" = "true" ]; then
              title_prefix="[arcus] [SMOKE TEST]"
            fi
            issue_url=$(gh issue create --repo "$REPO" \
              --title "${title_prefix} Health check failure" \
              --body-file "$body_file" \
              --label "$label")
            echo "Created $issue_url"
            if [ -n "${PROJECTS_TOKEN:-}" ]; then
              GH_TOKEN="$PROJECTS_TOKEN" gh project item-add 6 \
                --owner shigeo-nakamura --url "$issue_url" \
                || echo "::warning::Failed to add $issue_url to project #6"
            else
              echo "::warning::PROJECTS_TOKEN unset -- skipping project link"
            fi
          fi
