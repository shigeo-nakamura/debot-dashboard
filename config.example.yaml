#      status_path: /opt/debot-bull-holder/bull_holder/status.json
#      hyperliquid_address: "0x0000000000000000000000000000000000000000"
#      lighter_account_index: "0"
#      # Optional display-only snapshot verified against the bot startup log.
#      # Replace the example fingerprint with the matching status.config_fp.
#      investment:
#        config_fp: "000000000000"
#        equity_usd: 1000
#        spot_fraction: 0.90
#        perp_fraction: 0.45
#        # Buy & hold benchmark anchor (bot-strategy#955): when the
#        # capital was deployed and what each leg cost then, both
#        # verified against the same startup log as the rest of this
#        # snapshot. Without it the benchmark rows render "-".
#        # `price_usd` is the leg's price at `ts`; `spot_symbol` is the
#        # Hyperliquid spot token the current price is read from and is
#        # needed for wrapped assets (BTC → UBTC, ETH → UETH). Legs are
#        # equal-weight by USD, matching how a tranche is deployed.
