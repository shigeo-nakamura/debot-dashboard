region: eu-central-1
poll_interval_secs: 20
# Standard targets read status.json from S3. The bot must have its
# STATUS_S3_BUCKET / STATUS_S3_KEY_PREFIX env vars set so it mirrors
# `status.json` to the same key — see bot-strategy#343.
#
# `region` keeps its display meaning ("where the bot runs", used for
# FE region grouping); `s3_region` selects the bucket's region — only
# needed when it differs from `region`. The shared `debot-dashboard`
# bucket lives in eu-central-1 today, so Tokyo targets typically set
# `region: ap-northeast-1` + `s3_region: eu-central-1`.
#
# Service liveness is derived from object freshness — a status object
# older than stale_after_secs (default 180 s) flips the target to "stale". No probe traffic
# touches the bot host.
#
# Optional per-target `dex:` overrides the venue label shown on the
# card. Leave unset to use whatever the bot self-reports in its
# `status.json`'s `dex` field; set it when that value is bare/ambiguous
# (e.g. a Lighter-connector bot reports "lighter" whether it's running
# against zkLighter mainnet or a different chain's Lighter deployment)
# or when the bot doesn't report `dex` at all.
#
# Optional per-target `bucket:` declares the return source
# (`alpha_candidate` / `beta` / `subsidy`) that decides which benchmark
# the card is judged against. Leave it unset to inherit the
# classification the taxonomy already records for the service
# (docs/buckets.md, mirroring bot-strategy docs/return-source-taxonomy.md
# §3); a service the taxonomy doesn't list renders as "unclassified" and
# stays out of every aggregate. Setting it to something the taxonomy
# contradicts is a startup error — re-bucketing a bot is a change to the
# ledger first. `name:` doesn't need a region or bucket suffix — the FE
# groups cards under a bucket header and shows the region on the card.
targets:
  # Example S3-backed target (a pairtrade instance mirroring status.json).
  # The Frankfurt BTC/ETH pairtrade fleet was sunset on 2026-09-06; the
  # Robinhood Chain Lighter pairtrade bot (Tokyo) is the remaining example.
  - name: Robinhood Freq
    instance_id: i-xxxxxxxxxxxxxxxxx
    service: debot-pair-robinhood-lighter
    region: ap-northeast-1
    s3_bucket: debot-dashboard
    s3_region: eu-central-1
    s3_key: debot/status/robinhood-lighter/debot-pair-robinhood-lighter-freq.json
    dex: "Lighter (Robinhood Chain)"
    # Optional: inherited from docs/buckets.md when omitted.
    bucket: subsidy
    # Cost-per-unit KPI for a subsidy bot (bot-strategy#938/#957). Only
    # valid on a target in the subsidy bucket. `unit` must match the unit
    # the bot's own ledger reports, or its units are not rendered — a
    # points figure priced with an activity conversion is worse than no
    # KPI. The imputed value is an operator assumption and is always
    # shown with the date it was sourced. Set `program_changed_on` when
    # the venue changes points weights or activity rules; the card marks
    # the KPI stale until `kpi_reviewed_on` catches up.
    subsidy:
      unit: points
      imputed_unit_value_usd: 0.05
      value_source_date: "2026-09-08"
      # program_changed_on: "2026-09-01"
      # kpi_reviewed_on: "2026-09-05"
# HYPE accumulator targets use the same freshness/health path but render the
# nested accumulator balance/activity view instead of PnL statistics — it
# also shows an "Unrealized PnL" row when the S3 object was written by the
# bot's `--dry-run-cycle` (which attaches an `operations.spent_usdc` figure),
# not by the lightweight read-only `hype-status` observer (bot-strategy#908).
# Point `s3_key` at the dry-run-cycle's mirrored status.json — the two
# processes must use distinct STATUS_S3_KEY_PREFIX values on the host or
# they will overwrite each other's object on the same 5-minute cadence.
#  - name: HYPE Accumulator
#    instance_id: i-xxxxxxxxxxxxxxxxx
#    service: hype-accumulator
#    region: ap-northeast-1
#    s3_bucket: debot-dashboard
#    s3_region: eu-central-1
#    s3_key: debot/status/hype-accumulator/status.json
#    bucket: beta
#    # DCA benchmark (bot-strategy#956): the card compares the bot's
#    # realised cost basis with what the same budget would have paid on a
#    # naive equal-USD daily schedule over the same window. The bot does
#    # not report when it started buying, and guessing that date from a
#    # snapshot would silently move the benchmark, so the operator
#    # verifies it here. `coin` is the Hyperliquid market whose daily
#    # closes stand in for the schedule's prices (default HYPE).
#    accumulator:
#      dca:
#        window_start: "2026-09-11"
#        coin: HYPE
# Bull-holder uses its existing same-host status file and public read-only
# balance APIs. Do not set s3_bucket/s3_key for this target. See
# deploy/bull-holder.md for data meanings and rollout instructions.
#  - name: Bull-holder
