#          ts: 1757203200
#          assets:
#            - symbol: BTC
#              spot_symbol: UBTC
#              price_usd: 111000
#            - symbol: ETH
#              spot_symbol: UETH
#              price_usd: 4300
# Use the dedicated funded account address/index, not an API signing wallet.
# Empty identifiers show "not configured"; no signing keys are needed.
# auth:
#   username: admin
#   password: change-me

# Book runtime targets (bot-strategy#937) mirror status.json the same way
# pairtrade does, and render an extra "Book runtime" section beside the
# normal trading view: last decision + its signal hash, the current
# signal-window state, gross/net/equity, and the next decision time. The
# instance writes to debot/status/book-<instance>/status.json; see
# deploy/book-runtime.md.
#  - name: XSMOM
#    instance_id: i-xxxxxxxxxxxxxxxxx
#    service: book-runtime-xsmom-695
#    region: ap-northeast-1
#    s3_bucket: debot-dashboard
#    s3_region: eu-central-1
#    s3_key: debot/status/book-xsmom-695/status.json
#    dex: "Lighter (zkLighter mainnet)"
#    # Pre-registered gate for an α candidate (bot-strategy#958). Only
#    # valid on a target in the alpha_candidate bucket. The card shows
#    # the sample count against `required_samples`, the readout date and
#    # this frozen `spec_hash`, and hides PnL / equity curve / win rate /
#    # CAGR — reading those before the readout is peeking. When the bot
#    # reports a different spec hash, the sample count is withheld.
#    gate:
#      spec_hash: "000000000000"
#      required_samples: 60
#      readout_on: "2026-10-02"
#      sample_source: "book runtime decision journal (bot-strategy#937)"

