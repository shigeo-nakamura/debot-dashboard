region: eu-central-1
poll_interval_secs: 20
targets:
  - name: debot00
    instance_id: i-0c08fba996bc21879
    service: debot00
    status_path: /home/ec2-user/debot_status/debot00/status.json
  - name: debot01
    instance_id: i-0c08fba996bc21879
    service: debot01
    status_path: /home/ec2-user/debot_status/debot01/status.json
  # Tokyo pairtrade on Extended (bot-strategy#123). Per-target `region`
  # overrides the top-level region so one dashboard monitors both Frankfurt
  # and Tokyo via SSM.
  - name: debot-pair-btceth-ext
    instance_id: i-015f7f9388cac0a1b
    service: debot-pair-btceth-extended
    region: ap-northeast-1
    status_path: /home/ec2-user/debot_status/debot-pair-btceth-ext/status.json
  # Tokyo pairtrade on Lighter (bot-strategy#218). One target per A/B/C
  # variant; service name matches Frankfurt's debot-pair-btceth so the
  # consolidated single-process unit is reused unchanged.
  - name: debot-pair-btceth-tokyo-a
    instance_id: i-015f7f9388cac0a1b
    service: debot-pair-btceth
    region: ap-northeast-1
    status_path: /home/ec2-user/debot_status/debot-pair-btceth-a/status.json
  - name: debot-pair-btceth-tokyo-b
    instance_id: i-015f7f9388cac0a1b
    service: debot-pair-btceth
    region: ap-northeast-1
    status_path: /home/ec2-user/debot_status/debot-pair-btceth-b/status.json
  - name: debot-pair-btceth-tokyo-c
    instance_id: i-015f7f9388cac0a1b
    service: debot-pair-btceth
    region: ap-northeast-1
    status_path: /home/ec2-user/debot_status/debot-pair-btceth-c/status.json
# Per-target `source: s3` (bot-strategy#343) reads status.json directly
# from S3 instead of via SSM SendCommand. The bot must have its
# STATUS_S3_BUCKET / STATUS_S3_KEY_PREFIX env vars set so it mirrors
# status.json to the same key. `region` keeps its usual meaning
# ("where the bot runs", used for FE region grouping); `s3_region`
# selects the bucket's region (always eu-central-1 for the shared
# `debot-dashboard` bucket today). Service liveness is derived from
# object freshness — a status object older than ~3 min flips the
# target to "stale" without an SSM probe.
#
#   - name: debot-pair-btceth-tokyo-a
#     instance_id: i-015f7f9388cac0a1b
#     service: debot-pair-btceth
#     region: ap-northeast-1
#     source: s3
#     s3_bucket: debot-dashboard
#     s3_region: eu-central-1
#     s3_key: debot/status/tokyo/debot-pair-btceth-a.json
# auth:
#   username: admin
#   password: change-me
